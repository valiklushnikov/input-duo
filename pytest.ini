[pytest]
# Pytest configuration for the whole repository - not only configurator/.
#
# docs/superpowers/plans/2026-09-03-pio-usb-hub-v1-implementation.md's Final
# Verification Gate, and tools/build_release.ps1's "Running the Python
# suites" step, both name `python -m pytest configurator/tests tests -q`
# verbatim as the one command that proves the whole tree is green.
#
# Before this file existed, that command had no repository-root ini to find:
# pytest locates the nearest ini file above the *first* path it is given,
# and "configurator/tests" is nearer to configurator/pyproject.toml than
# "tests" is to anything at the repository root - so the command silently
# ran under configurator/pyproject.toml's [tool.pytest.ini_options] instead.
# That ini sets no norecursedirs of its own, so pytest's *default* applied:
# ['*.egg', '.*', '_darcs', 'build', 'CVS', 'dist', 'node_modules', 'venv',
# '{arch}']. The literal name "build" in that list matches any directory so
# named, anywhere - including tests/build/, exactly as readily as the
# compiled build/ tree at the repository root. The result: every test under
# tests/build/ - the PIO USB toolchain lock, the firmware artifact contract,
# the CH375/PIO_USB backend-label guard, and the release script's own
# naming/guard coverage - was silently absent from the one command
# everything else in this project trusts to be complete. See the Task 12
# fix-round-2 report for how this was found and measured.
#
# The fix has two parts, because norecursedirs matches by basename alone
# (blind to path) and so cannot itself tell tests/build/ apart from
# build/pico-release/, build/native/ or any of the other build/* preset
# directories at the repository root:
#
#   - "build" is dropped from norecursedirs below, so pytest is willing to
#     recurse into any directory literally named that - tests/build/
#     included.
#   - --ignore=build (and --ignore=dist, for the same reason applied to
#     configurator/dist-shaped output) name the specific top-level paths
#     that must still never be walked, by path rather than by name - which
#     is exactly the distinction norecursedirs cannot make. Both are
#     resolved relative to this file's directory (the repository root), so
#     they reach only the top-level build/ and dist/ trees, never
#     tests/build/.
#
# .deps/ and every other dot-prefixed directory remain excluded by the
# unchanged ".*" pattern below - the same one pytest defaults to.
#
# This file's mere presence also fixes where the gate command's rootdir and
# ini resolve to: once it exists, walking upward from either "configurator/
# tests" or "tests" reaches this file (at the repository root) before
# either arg reaches its own nearer, narrower ini - so both commands agree
# on one configuration instead of the first arg silently picking one for
# both.
norecursedirs = .* venv node_modules {arch} CVS _darcs *.egg
addopts = --ignore=build --ignore=dist
