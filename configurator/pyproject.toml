[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duo-input"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[project.scripts]
duo-input-configurator = "duo_input.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
