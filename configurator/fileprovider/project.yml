name: DuoInputFileProvider
options:
  bundleIdPrefix: com.duoinput.configurator
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: 4YKVN22BMX
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # Production File Provider extension. Compiles the shared Objective-C XPC
  # protocol (Shared/) and exposes it to Swift via the bridging header, so both
  # the extension and the PyObjC host build interfaces from ONE protocol source.
  DuoInputFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duoinput.configurator.fileprovider
        PRODUCT_MODULE_NAME: DuoInputFileProvider
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Shared/DuoFP-Bridging.h
  # Logic unit-test bundle: compiles the extension + shared sources directly so
  # FileProviderExtension/DuoXPC/protocols are referenceable without linking the
  # (non-linkable) .appex product.
  DuoInputFileProviderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Extension
      - path: Shared
    # The golden generation-record fixture is the SAME file
    # `test_fileprovider_replica.py` reads on the Python side (Task 4) - one
    # shared vector, two consumers, so a schema drift fails on both sides.
    # xcodegen 2.46.0 silently drops a `resources:` entry whose path escapes
    # the project directory via ".." (no PBXResourcesBuildPhase entry is
    # emitted, no warning/error), AND silently drops one under a brand-new
    # top-level directory not already covered by a `sources:` path (verified
    # both independently: "Fixtures/x.json" as a new top-level dir was
    # dropped; "Tests/x.json" under the already-declared Tests source root
    # was picked up). So the canonical fixture is referenced through an
    # in-tree symlink placed inside the existing Tests/ group
    # (Tests/generation_record.json -> ../../tests/transfer/fixtures/...) -
    # it is still the SAME file on disk (git preserves the symlink itself on
    # checkout, so this survives clones too), not a copy that can drift.
    resources:
      - path: Tests/generation_record.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duoinput.configurator.fileprovider.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Shared/DuoFP-Bridging.h
  # The clang shim the PyObjC host loads (ctypes.CDLL + objc.protocolNamed).
  # Produces libduofpproto.dylib from the SAME Shared/DuoFPProto.m the Swift
  # targets compile — one protocol contract, two consumers. Nuitka embedding of
  # this dylib into Contents/Frameworks is Task 18.
  duofpproto:
    type: library.dynamic
    platform: macOS
    sources:
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: libduofpproto
        PRODUCT_BUNDLE_IDENTIFIER: com.duoinput.configurator.duofpproto
        SKIP_INSTALL: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        DEFINES_MODULE: NO
    dependencies:
      - sdk: Foundation.framework
schemes:
  DuoInputFileProvider:
    build:
      targets:
        DuoInputFileProvider: all
        duofpproto: all
        DuoInputFileProviderTests: [test]
    test:
      targets:
        - DuoInputFileProviderTests
